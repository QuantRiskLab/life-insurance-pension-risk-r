
name: R Actuarial Model Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Run actuarial model tests
        run: Rscript tests/test_models.R

      - name: Generate actuarial visualizations
        run: Rscript R/visualization.R

      - name: Upload visualizations
        uses: actions/upload-artifact@v4
        with:
          name: actuarial-risk-figures
          path: figures/*.png
